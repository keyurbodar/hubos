name = "hubos"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "hubos-db"
database_id = "d8041392-d9cc-43f1-b745-995f39bf1c81"
migrations_dir = "migrations"

[[services]]
binding = "XEFFECT"
service = "xeffect"

# Daily 10:00 IST (04:30 UTC) sync of doomscroll signals + partner sheet + post metrics
[triggers]
crons = ["30 4 * * 1-6"]

[vars]
XEFFECT_URL = "https://xeffect.keyurbodar18.workers.dev/mcp"
NOTION_SPACE_ID = "835b528e-c5a8-4a45-896b-ff702fdbc807"
NOTION_COLLECTION_ID = "2c83c88d-5f69-81c5-93d6-000b91d99eae"
NOTION_VIEW_ID = "2c83c88d-5f69-81c2-a200-000c87115fd9"

# Secrets (set via `wrangler secret put`):
# - HUB_MCP_TOKEN: bearer token for hubos /mcp
# - XEFFECT_TOKEN: bearer token for the general xeffect /mcp server
# - PARTNER_SHEET_CSV_URL: optional private CSV export URL for partner tracker
# - NOTION_COOKIE: Notion session cookie header / JSON for read-only v3 API access
